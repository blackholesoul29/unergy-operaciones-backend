name: tests

on:
  pull_request:
    branches: [master]
  # La llama deploy.yml antes de desplegar. Sin `push: master` a proposito: si
  # no, cada push a master correria la suite dos veces.
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key-placeholder
        run: uv run pytest -q

version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: operaciones_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-operaciones}
      POSTGRES_USER: ${POSTGRES_USER:-operaciones}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-operaciones}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-operaciones}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: operaciones_backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: operaciones_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  postgres_data:
  uploads_data:

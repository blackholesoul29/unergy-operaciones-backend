[project]
name = "unergy-operaciones-backend"
version = "0.1.0"
description = "Backend FastAPI de la plataforma de Operaciones de Unergy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2",
    "alembic>=1.13.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "apscheduler>=3.10.0",
    "pytz",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "google-api-python-client>=2.120.0",
    "google-auth>=2.29.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# El repo no es un paquete instalable: la app corre desde el codigo fuente
# (`uvicorn app.main:app` con working_dir en la raiz). Sin esto, uv intentaria
# construir un wheel y setuptools se atoraria con los ~10 directorios de la raiz.
package = false
